{% load static %}
<!DOCTYPE html>
<html lang="es-cl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGR - Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #A90011; }
        .input-custom { background-color: transparent; border: 2px solid white; color: white; }
        .input-custom::placeholder { color: rgba(255,255,255,0.7); }
        .input-custom:focus { background-color: rgba(255,255,255,0.1); border-color: white; color: white; box-shadow: 0 0 0 0.25rem rgba(255,255,255,0.25); }
        .text-brand { color: #A90011 !important; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100 text-white">
    <div class="container text-center" style="max-width: 450px;">
        <h2 class="fw-bold mb-3">Recuperación de Acceso</h2>
        <p class="mb-4">Ingresa tu correo institucional registrado en el sistema. Te enviaremos las instrucciones para restablecer tu contraseña.</p>
        
        <form method="POST" class="mb-3">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger text-start py-2">{{ form.email.errors }}</div>
            {% endif %}
            <div class="mb-3">
                <!-- Uso de form-control de Bootstrap combinado con estilos custom -->
                <input type="email" name="email" class="form-control form-control-lg input-custom" placeholder="ejemplo@laserena.cl" required id="id_email">
            </div>
            <button type="submit" class="btn btn-light btn-lg w-100 fw-bold text-brand">ENVIAR INSTRUCCIONES</button>
        </form>
        <a href="{% url 'principal:inicio' %}" class="text-white text-decoration-none border-bottom border-light">Volver al inicio de sesión</a>
    </div>
</body>
</html>
