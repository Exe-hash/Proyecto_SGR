<button type="button" class="commitment-card" data-commitment data-code="{{ c.codigo }}" data-title="{{ c.titulo }}" data-territory="{{ c.territorio }}" data-responsible="{{ c.responsable }}" data-state="{{ c.estado }}" data-area="{{ c.area }}" data-requester="{{ c.solicitante }}" data-date="{{ c.fecha }}"><span class="commitment-top"><span class="territory">Territorio: {{ c.territorio }}</span><span class="due"><svg class="icon"><use href="#icon-clock"/></svg> {{ c.plazo|upper }}</span></span><strong>{{ c.titulo }}</strong><small>Resp: {{ c.responsable }}</small></button>
