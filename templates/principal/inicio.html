{% load static %}
<!DOCTYPE html>
<html lang="es-cl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGR - Ingreso al Sistema</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #A90011; }
        
        
        .custom-icon { 
            background-color: #A90011 !important; 
            border: 2px solid white !important; 
            border-right: none !important; 
            color: white !important; 
        }
        .custom-input { 
            background-color: #A90011 !important; 
            border: 2px solid white !important; 
            border-left: none !important; 
            color: white !important; 
        }
        .custom-input::placeholder { color: rgba(255,255,255,0.8) !important; }
        .custom-input:focus { 
            background-color: #A90011 !important; 
            box-shadow: none !important; 
        }
        
        
        .input-group:focus-within .custom-icon, 
        .input-group:focus-within .custom-input { 
            box-shadow: 0 0 0 0.25rem rgba(255,255,255,0.25) !important; 
        }
        
        .text-brand { color: #A90011 !important; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100 text-white">

    <div class="container text-center" style="max-width: 400px;">
        <div class="mb-5">
            
            <img src="{% static 'img/logo_la_serena.png' %}" alt="La Serena Ilustre Municipalidad" class="img-fluid" style="max-width: 300px;">
        </div>

        {% if error_inicio %}
            <div class="alert alert-danger py-2 shadow-sm text-start" role="alert">
                {{ error_inicio }}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'principal:inicio' %}" class="mb-4">
            {% csrf_token %}
            
            <div class="input-group mb-3 input-group-lg shadow-sm">
                <span class="input-group-text custom-icon" id="basic-addon1">
                    
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
                      <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664"/>
                    </svg>
                </span>
                <input type="email" name="username" class="form-control custom-input" placeholder="Correo Institucional" aria-label="Correo" aria-describedby="basic-addon1" required autofocus>
            </div>
            
            <div class="input-group mb-4 input-group-lg shadow-sm">
                <span class="input-group-text custom-icon" id="basic-addon2">
                    
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                      <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2M5 8h6a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1"/>
                    </svg>
                </span>
                <input type="password" name="password" class="form-control custom-input" placeholder="*************" aria-label="Contraseña" aria-describedby="basic-addon2" required>
            </div>
            
            <button type="submit" class="btn btn-light btn-lg w-100 fw-bold text-brand shadow-sm">INGRESAR</button>
        </form>

        <a href="{% url 'principal:password_reset' %}" class="text-white text-decoration-none border-bottom border-light pb-1">¿Has olvidado tu contraseña?</a>
    </div>

</body>
</html>
